spring.datasource.url=jdbc:sqlite:Stardust.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=5000
spring.application.name=Bye Bye Birdie
site.name=Bye Bye Birdie
site.description=A community for new and expert birders to connect, share sightings, exchange knowledge, and explore together.
spring.thymeleaf.cache=false
