<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{layout :: head(${title})}">
    <meta charset="UTF-8">
    <title th:text="${title}">Directory</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<nav th:replace="~{header :: header}"></nav>

<div class="container mt-4">

    <h1 th:text="${title}">Directory</h1>

    <!-- BIRD DIRECTORY DESCRIPTION -->
    <p class="text-muted"
       th:if="${itemType == 'ebird'}">
        Browse the bird directory and search by common or scientific name.
    </p>

    <!-- SPECIES DIRECTORY DESCRIPTION -->
    <p class="text-muted"
       th:if="${itemType != 'ebird'}">
        Browse all species in the wiki. Click one to view its page.
    </p>


    <!-- BREADCRUMB -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">

            <li class="breadcrumb-item">
                Wiki
            </li>

            <li class="breadcrumb-item active"
                aria-current="page"
                th:text="${title}">
                Birds
            </li>

        </ol>
    </nav>


    <!-- BIRD SEARCH -->
    <form th:if="${itemType == 'ebird'}"
          th:action="@{/wiki/bird}"
          method="get"
          class="bird-search-form mb-4">

        <div class="input-group">

            <input type="text"
                   name="search"
                   class="form-control"
                   placeholder="Search birds..."
                   th:value="${search}">

            <div class="input-group-append">

                <button type="submit"
                        class="btn btn-primary">
                    Search
                </button>

            </div>

        </div>

    </form>


    <h3 class="mb-3"
        th:text="${title}">
        Directory
    </h3>


    <!-- ========================================
         EBIRD RESULTS
    ======================================== -->

    <div class="row"
         th:if="${itemType == 'ebird'}">

        <div class="col-md-4 mb-3"
             th:each="item : ${items}">

            <a class="directory-card-link"
               th:href="@{'/wiki/bird/code/' + ${item.speciesCode}}">

                <div class="card directory-card">

                    <div class="card-body">

                        <span class="directory-item-name"
                              th:text="${item.comName}">
                            Northern Cardinal
                        </span>

                        <span class="directory-item-type"
                              th:text="${item.sciName}">
                            Cardinalis cardinalis
                        </span>

                    </div>

                </div>

            </a>

        </div>

    </div>


    <!-- NO BIRD RESULTS -->
    <div th:if="${itemType == 'ebird' and #lists.isEmpty(items)}"
         class="alert alert-light mt-3">

        No birds found.

    </div>


    <!-- ========================================
         EXISTING DATABASE DIRECTORY
         Used for Species
    ======================================== -->

    <div class="row"
         th:if="${itemType != 'ebird'}">

        <div class="col-md-4 mb-3"
             th:each="item : ${items}">

            <div class="card directory-card">

                <div class="card-body d-flex align-items-center justify-content-between">

                    <a class="directory-item-link"
                       th:href="@{'/wiki/' + ${urlSegment} + '/' + ${item.id}}">

                        <span class="directory-item-name"
                              th:text="${item.name}">
                            Item Name
                        </span>

                        <span class="directory-item-type"
                              th:text="${itemType}">
                            type
                        </span>

                    </a>


                    <div class="directory-card-controls">

                        <span class="directory-chevron">
                            &rsaquo;
                        </span>

                        <button type="button"
                                class="directory-action-btn"
                                aria-label="More actions">
                            &hellip;
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
