<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{layout :: head(${title})}">
    <meta charset="UTF-8">
    <title th:text="${title}">Directory</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{header :: header}"></nav>

<div class="container mt-4">

    <h1 th:text="${title}">Directory</h1>
    <p class="text-muted" th:text="'Browse all ' + ${title} + ' in the wiki. Click one to view its page.'">
        Browse the directory. Click one to view its page.
    </p>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Wiki</li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${title}">Birds</li>
        </ol>
    </nav>

    <h3 class="mb-3" th:text="${title}">Directory</h3>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="item : ${items}">
            <div class="card directory-card">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <a class="directory-item-link"
                       th:href="@{'/wiki/' + ${urlSegment} + '/' + ${item.id}}">
                        <span class="directory-item-name" th:text="${item.name}">Item Name</span>
                        <span class="directory-item-type" th:text="${itemType}">type</span>
                    </a>
                    <div class="directory-card-controls">
                        <span class="directory-chevron">&rsaquo;</span>
                        <button type="button" class="directory-action-btn" aria-label="More actions">&hellip;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
