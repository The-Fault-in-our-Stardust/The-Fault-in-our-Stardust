<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Discussions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin-bottom: 8px;
        }

        <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f7f7f7;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 85%;
        max-width: 1000px;
        margin: 40px auto;
    }

    .page-header {
        background-color: #C9B6E4;
        padding: 25px;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    .page-header h1 {
        margin-top: 0;
        margin-bottom: 8px;
    }

    .page-header p {
        margin-bottom: 0;
    }

    .discussion-card {
        background-color: white;
        border: 1px solid #FFF176;
        border-left: 8px solid #C9B6E4;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
    }

    .discussion-card h3 {
        margin-top: 0;
        margin-bottom: 8px;
    }

    .discussion-card p {
        margin-bottom: 0;
        color: #555;
    }
    </style>
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>Discussions</h1>
        <p>Join the conversation and connect with the community.</p>
    </div>

    <div class="discussion-card">
        <h3>General Discussion</h3>
        <p>Talk about anything with the community.</p>
    </div>

    <div class="discussion-card">
        <h3>Questions & Advice</h3>
        <p>Ask questions and get help from other users.</p>
    </div>

    <div class="discussion-card">
        <h3>Community</h3>
        <p>Share updates, ideas, and conversations.</p>
    </div>

</div>

</body>
</html>
