<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{layout :: head('Discussions')}"></head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-4">

    <div class="page-header">
        <h1>Discussions</h1>
        <p>Join the conversation and connect with the community.</p>
    </div>

   <div th:if="${posts == null or #lists.isEmpty(posts)}" class="text-muted">
    No discussions yet.
    </div>

    <div th:each="post : ${posts}" class="discussion-card">

        <h3>
            <a th:href="@{/viewpost(post=${post.id})}"
               th:text="${post.title}">
                Discussion Title
            </a>
        </h3>

        <p th:text="${post.content}">
            Discussion content
        </p>

        <small class="text-muted">
            Posted by
            <strong th:text="${post.user.username}">username</strong>
            &mdash;
            <span th:text="${post.timeString}">time</span>
        </small>

    </div>

</div>

<style>
    body {
        background-color: #f7f7f7;
    }

    .page-header {
        background-color: #C9B6E4;
        padding: 25px;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    .page-header h1 {
        margin-top: 0;
        margin-bottom: 8px;
    }

    .page-header p {
        margin-bottom: 0;
    }

    .discussion-card {
        background-color: white;
        border: 1px solid #FFF176;
        border-left: 8px solid #C9B6E4;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
    }

    .discussion-card h3 {
        margin-top: 0;
        margin-bottom: 8px;
    }

    .discussion-card h3 a {
        color: inherit;
        text-decoration: none;
    }

    .discussion-card h3 a:hover {
        text-decoration: underline;
    }

    .discussion-card p {
        margin-bottom: 10px;
        color: #555;
    }
</style>

</body>
</html>
