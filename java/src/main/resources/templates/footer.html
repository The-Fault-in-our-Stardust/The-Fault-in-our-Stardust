<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<footer th:fragment="footer" class="site-footer">

    <div class="site-container footer-grid">

        <!-- BRAND -->
        <div class="footer-brand">

            <a th:href="@{/}" class="footer-logo-link">
                <img
                    th:src="@{/images/birdielogo.png}"
                    src="/images/birdielogo.png"
                    alt="Bye Bye Birdie logo"
                    class="footer-logo"
                />
            </a>

            <p class="footer-description">
                A welcoming community for new and expert birders
                to connect, share sightings, exchange knowledge,
                and explore together.
            </p>

        </div>


        <!-- EXPLORE -->
        <div class="footer-links">

            <h3>Explore</h3>

            <a th:href="@{/subforum(sub=4)}">Discussions</a>
            <a th:href="@{/wiki/species}">Species</a>
            <a th:href="@{/wiki/bird}">Birds</a>

        </div>


        <!-- COMMUNITY -->
        <div class="footer-links">

            <h3>Community</h3>

            <a href="#">About</a>
            <a href="#">Community Guidelines</a>
            <a href="#">Contact</a>

        </div>


        <!-- SOCIAL -->
        <div class="footer-social">

            <h3>Follow the Flock</h3>

            <div class="footer-social-links">

                <a href="#" aria-label="Instagram">
                    Instagram
                </a>

                <a href="#" aria-label="Facebook">
                    Facebook
                </a>

                <a href="#" aria-label="YouTube">
                    YouTube
                </a>

            </div>

        </div>

    </div>


    <!-- BOTTOM FOOTER -->
    <div class="footer-bottom">

        <div class="site-container footer-bottom-inner">

            <p>
                &copy; 2026 Bye Bye Birdie
            </p>

            <p class="footer-tagline">
                CONNECT • SHARE • EXPLORE
            </p>

        </div>

    </div>

</footer>

</body>

</html>
